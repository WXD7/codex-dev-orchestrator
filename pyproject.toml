[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-dev-orchestrator"
version = "0.4.0"
description = "Recoverable engineering governance for LobeHub and a ChatGPT-authenticated local Codex CLI"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
codex-orchestrator = "orchestrator.cli:main"

[tool.setuptools]
packages = ["orchestrator"]

[tool.setuptools.package-data]
orchestrator = ["static/*", "schemas/*"]
