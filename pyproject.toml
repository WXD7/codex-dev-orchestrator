[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-dev-orchestrator"
version = "0.2.0"
description = "Stateless AI delivery governance for LobeHub, Kandev, Symphony and locally authenticated Codex"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
codex-orchestrator = "orchestrator.cli:main"

[tool.setuptools]
packages = ["orchestrator"]

[tool.setuptools.package-data]
orchestrator = ["static/*", "schemas/*", "templates/*"]
